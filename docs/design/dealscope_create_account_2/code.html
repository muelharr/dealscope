<style>
        body {
            background-color: #faf8ff;
            color: #191b24;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .strength-bar {
            transition: width 0.3s ease, background-color 0.3s ease;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.5);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- Hero/Background Animation -->
<div class="fixed inset-0 -z-10 pointer-events-none overflow-hidden">

</div>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center px-margin-mobile md:px-margin-desktop py-stack-lg">
<!-- Registration Container -->
<div class="w-full max-w-[440px] flex flex-col gap-stack-lg">
<!-- Branding Anchor -->
<div class="flex flex-col items-center text-center gap-stack-sm">
<div class="w-12 h-12 rounded-xl bg-primary flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-2xl" style="font-variation-settings: 'FILL' 1;">insights</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface">Create your DealScope account</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Start making data-driven decisions today.</p>
</div>
<!-- Form Card -->
<div class="glass-card rounded-xl p-stack-lg shadow-sm">
<form class="flex flex-col gap-stack-md" id="registrationForm">
<!-- Full Name -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="fullName">Full Name</label>
<div class="relative group">
<input class="w-full h-11 px-4 bg-surface-container-lowest border border-muted rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md outline-none" id="fullName" name="fullName" placeholder="Jane Cooper" required="" type="text"/>
</div>
</div>
<!-- Email -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="email">Work Email</label>
<div class="relative group">
<input class="w-full h-11 px-4 bg-surface-container-lowest border border-muted rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md outline-none" id="email" name="email" placeholder="jane@company.com" required="" type="email"/>
</div>
</div>
<!-- Password -->
<div class="flex flex-col gap-1.5">
<label class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-wider" for="password">Password</label>
<div class="relative group">
<input class="w-full h-11 px-4 bg-surface-container-lowest border border-muted rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md outline-none" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<!-- Strength Indicator -->
<div class="mt-2 flex flex-col gap-2">
<div class="h-1 w-full bg-surface-container rounded-full overflow-hidden">
<div class="strength-bar h-full w-0 bg-outline" id="strengthBar"></div>
</div>
<span class="font-body-sm text-body-sm text-outline-variant" id="strengthText">Enter a secure password</span>
</div>
</div>
<!-- TOS Checkbox -->
<div class="flex items-start gap-3 mt-2">
<input class="mt-1 w-4 h-4 text-primary border-muted rounded focus:ring-primary focus:ring-offset-0 transition-all cursor-pointer" id="tos" name="tos" required="" type="checkbox"/>
<label class="font-body-sm text-body-sm text-on-surface-variant leading-tight" for="tos">
                            I agree to the <a class="text-primary hover:underline underline-offset-2" href="#">Terms of Service</a> and <a class="text-primary hover:underline underline-offset-2" href="#">Privacy Policy</a>.
                        </label>
</div>
<!-- Action Button -->
<button class="w-full h-11 mt-4 bg-primary text-on-primary font-body-md font-semibold rounded-lg hover:bg-primary-container active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-sm" type="submit">
                        Create Account
                        <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
</div>
<!-- Social/Alt Sign Up (Optional minimalist touch) -->
<div class="flex flex-col gap-stack-md">
<div class="relative flex items-center py-2">
<div class="flex-grow border-t border-muted"></div>
<span class="flex-shrink mx-4 font-label-caps text-label-caps text-outline uppercase tracking-widest">or register with</span>
<div class="flex-grow border-t border-muted"></div>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="h-10 border border-muted bg-surface-container-lowest rounded-lg font-body-sm text-on-surface hover:bg-surface-container-low transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">google</span>
                         Google
                    </button>
<button class="h-10 border border-muted bg-surface-container-lowest rounded-lg font-body-sm text-on-surface hover:bg-surface-container-low transition-colors flex items-center justify-center gap-2">
<span class="material-symbols-outlined text-[18px]">work</span>
                         SSO
                    </button>
</div>
</div>
<!-- Sign In Link -->
<p class="text-center font-body-md text-body-md text-on-surface-variant">
                Already have an account? 
                <a class="text-primary font-semibold hover:underline underline-offset-4" href="#">Sign In</a>
</p>
</div>
</main>
<!-- Footer Segment -->
<footer class="w-full py-stack-md border-t border-muted/30">
<div class="max-w-container-max mx-auto px-margin-desktop flex flex-col md:flex-row justify-between items-center gap-4">
<span class="font-body-sm text-body-sm text-outline">© 2024 DealScope Intelligence. All rights reserved.</span>
<div class="flex gap-gutter">
<a class="font-body-sm text-body-sm text-outline hover:text-primary transition-colors" href="#">Privacy</a>
<a class="font-body-sm text-body-sm text-outline hover:text-primary transition-colors" href="#">Security</a>
<a class="font-body-sm text-body-sm text-outline hover:text-primary transition-colors" href="#">Contact</a>
</div>
</div>
</footer>
<script>
        // Password Strength Logic
        const passwordInput = document.getElementById('password');
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');
        const togglePassword = document.getElementById('togglePassword');

        passwordInput.addEventListener('input', () => {
            const val = passwordInput.value;
            let score = 0;

            if (val.length > 0) score = 1;
            if (val.length > 6) score = 2;
            if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score = 3;
            if (/[^A-Za-z0-9]/.test(val) && val.length > 10) score = 4;

            const states = [
                { width: '0%', color: 'bg-outline', text: 'Enter a secure password' },
                { width: '25%', color: 'bg-data-critical', text: 'Weak' },
                { width: '50%', color: 'bg-data-warning', text: 'Fair' },
                { width: '75%', color: 'bg-primary', text: 'Good' },
                { width: '100%', color: 'bg-data-positive', text: 'Excellent' }
            ];

            const state = states[score];
            strengthBar.style.width = state.width;
            strengthBar.className = `strength-bar h-full ${state.color}`;
            strengthText.innerText = state.text;
            strengthText.className = `font-body-sm text-body-sm ${score > 0 ? state.color.replace('bg-', 'text-') : 'text-outline-variant'}`;
        });

        // Toggle Visibility
        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = type === 'password' ? 'visibility' : 'visibility_off';
            togglePassword.innerHTML = `<span class="material-symbols-outlined text-[20px]">${icon}</span>`;
        });

        // Form Submission Interaction
        document.getElementById('registrationForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Creating Account...`;
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> Success!`;
                btn.classList.replace('bg-primary', 'bg-data-positive');
                setTimeout(() => {
                    // Simulating redirect
                    console.log('User registered. Redirecting...');
                    btn.innerHTML = originalContent;
                    btn.disabled = false;
                    btn.classList.replace('bg-data-positive', 'bg-primary');
                }, 1500);
            }, 2000);
        });
    </script>
</body></html>
