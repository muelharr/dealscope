<script>
        // Micro-interactions and UI state handling
        document.querySelectorAll('.settings-row-active').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.classList.add('scale-[0.99]');
            });
            button.addEventListener('mouseup', () => {
                button.classList.remove('scale-[0.99]');
            });
            button.addEventListener('mouseleave', () => {
                button.classList.remove('scale-[0.99]');
            });
        });

        // Sticky header opacity scroll effect
        window.addEventListener('scroll', () => {
            const header = document.querySelector('header');
            if (window.scrollY > 20) {
                header.classList.add('shadow-sm');
            } else {
                header.classList.remove('shadow-sm');
            }
        });
    </script>
