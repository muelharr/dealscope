<!-- Login Form -->
<form class="space-y-stack-md" onsubmit="event.preventDefault();">
<div>
<label class="block font-body-sm text-on-surface font-medium mb-1.5 ml-1" for="email">Email address</label>
<input class="w-full h-11 px-4 bg-surface-subtle border border-border-muted rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md" id="email" placeholder="name@company.com" type="email"/>
</div>
<div>
<div class="flex justify-between items-center mb-1.5 ml-1">
<label class="block font-body-sm text-on-surface font-medium" for="password">Password</label>
<a class="font-body-sm text-primary hover:text-on-primary-fixed-variant transition-colors font-medium" href="#">Forgot password?</a>
</div>
<div class="relative">
<input class="w-full h-11 px-4 bg-surface-subtle border border-border-muted rounded-lg focus:ring-2 focus:ring-primary focus:border-primary transition-all font-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<div class="flex items-center gap-2 px-1">
<input class="w-4 h-4 rounded border-border-muted text-primary focus:ring-primary" id="remember" type="checkbox"/>
<label class="font-body-sm text-on-surface-variant" for="remember">Keep me signed in for 30 days</label>
</div>
<button class="w-full h-12 bg-primary text-on-primary font-body-md font-semibold rounded-lg hover:bg-on-primary-fixed-variant active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-stack-md" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</form>
<p class="mt-stack-lg text-center font-body-sm text-on-surface-variant">
                New to DealScope? 
                <a class="text-primary font-semibold hover:underline" href="#">Create an account</a>
</p>

<a class="hover:text-primary transition-colors" href="#">Privacy</a>

<div class="absolute top-[-10%] right-[-5%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-10%] left-[-5%] w-[40%] h-[40%] bg-tertiary/5 blur-[120px] rounded-full"></div>
</div>
<script>
        // Micro-interaction for the password visibility toggle
        const toggleBtn = document.querySelector('.absolute.right-3');
        const passwordInput = document.getElementById('password');
        const iconSpan = toggleBtn?.querySelector('.material-symbols-outlined');

        toggleBtn?.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            iconSpan.textContent = type === 'password' ? 'visibility' : 'visibility_off';
        });

        // Add subtle focus ring animation via JS for high-end feel
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.style.transform = 'translateY(-1px)';
                input.parentElement.style.transition = 'transform 0.2s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.style.transform = 'translateY(0)';
            });
        });
    </script>
